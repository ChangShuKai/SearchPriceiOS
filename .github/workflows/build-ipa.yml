name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Native Folders
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Unsigned App
        run: |
          cd ios
          # 取得正確的 Scheme 名稱
          SCHEME_NAME=$(xcodebuild -workspace SearchPrice.xcworkspace -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); schemes=data.get('workspace', {}).get('schemes', []); print(schemes[0] if schemes else 'SearchPrice')")
          echo "Building Scheme: $SCHEME_NAME"

          # 明確指定 destination 為一般 iOS 裝置，並將 SYMROOT 鎖定在目前目錄的 output
          xcodebuild -workspace SearchPrice.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            SYMROOT="$(pwd)/output" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package to IPA
        run: |
          # 檢查指定的 output 目錄產出
          APP_PATH=$(find ios/output/Release-iphoneos -name "*.app" -maxdepth 1 2>/dev/null | head -n 1)
          
          # 若該目錄沒有，則進行全局查找
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" ! -path "*/Pods/*" | head -n 1)
          fi

          echo "Target App Path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: Xcode compilation did not produce any .app bundle."
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SearchPriceiOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SearchPriceiOS-ipa
          path: SearchPriceiOS.ipa
          retention-days: 7
