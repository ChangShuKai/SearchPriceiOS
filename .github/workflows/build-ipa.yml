name: Build SearchPrice (Android and iOS)

on:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 任務 1：Android APK 編譯（獨立執行，約 10~15 分鐘）
  # ------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..
          
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" SearchPrice.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SearchPrice-Android-APK
          path: SearchPrice.apk
          retention-days: 7

  # ------------------------------------------------------------------
  # 任務 2：iOS IPA 編譯（獨立執行，由 macOS 專門處理）
  # ------------------------------------------------------------------
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Application
        run: |
          cd ios
          
          # 列出所有 Targets 與 Schemes 供檢查
          xcodebuild -list
          
          # 取得 Target 名稱（通常即為專案名稱）
          TARGET_NAME=$(xcodebuild -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); targets=data.get('project', {}).get('targets', []); print(targets[0] if targets else 'SearchPrice')")
          echo "Building Target: $TARGET_NAME"

          mkdir -p build_output

          # 使用 target 進行 Release 編譯，強制產出完整 .app 到 build_output
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme "$TARGET_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build_output" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

          cd ..

      - name: Package iOS IPA
        run: |
          echo "Files in build_output:"
          ls -la ios/build_output || true

          APP_PATH=$(find ios/build_output -type d -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -type d -name "*.app" ! -path "*/Pods/*" | head -n 1)
          fi

          echo "Target App Path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: Xcode did not produce any .app bundle."
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SearchPrice.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SearchPrice-iOS-IPA
          path: SearchPrice.ipa
          retention-days: 7
