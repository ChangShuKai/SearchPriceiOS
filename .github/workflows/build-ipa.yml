name: Build SearchPrice iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS Native Project
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile & Install CocoaPods
        run: |
          cd ios
          python3 -c "
          with open('Podfile', 'r') as f:
              content = f.read()

          patch = '''
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                end
              end
          '''
          if 'post_install do |installer|' in content:
              content = content.replace('post_install do |installer|', 'post_install do |installer|' + patch)
              with open('Podfile', 'w') as f:
                  f.write(content)
          "
          pod install
          cd ..

      - name: Build iOS Application (Archive)
        run: |
          cd ios
          export NODE_BINARY=$(which node)

          # 採用標準 archive 流程，完全避免自訂 output 目錄衝突
          xcodebuild archive \
            -workspace SearchPrice.xcworkspace \
            -scheme SearchPrice \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$(pwd)/SearchPrice.xcarchive" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

          cd ..

      - name: Package iOS IPA
        run: |
          # 直接從 xcarchive 的 Products/Applications 提取編譯好的 .app
          APP_PATH=$(find ios/SearchPrice.xcarchive/Products/Applications -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Searching fallback app path:"
            APP_PATH=$(find . -type d -name "*.app" ! -path "*/Pods/*" | head -n 1)
          fi

          echo "Target App Path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app found in archive."
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SearchPrice.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SearchPrice-iOS-IPA
          path: SearchPrice.ipa
          retention-days: 7
