name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Native Folders
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Archive App
        run: |
          cd ios
          SCHEME_NAME=$(xcodebuild -workspace SearchPrice.xcworkspace -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); schemes=data.get('workspace', {}).get('schemes', []); print(schemes[0] if schemes else 'SearchPrice')")
          echo "Target Scheme: $SCHEME_NAME"

          # 建立輸出目錄
          mkdir -p build

          # 執行 archive，加入允許 ad-hoc / 無簽名參數
          xcodebuild archive \
            -workspace SearchPrice.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/SearchPrice.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          echo "Checking archive contents:"
          ls -la build/SearchPrice.xcarchive/Products/Applications || true

      - name: Package to IPA
        run: |
          mkdir -p Payload
          
          # 精確抓取剛剛產出的 .app
          APP_PATH=$(find ios/build/SearchPrice.xcarchive/Products/Applications -name "*.app" -maxdepth 1 2>/dev/null | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Searching all .app in workspace as fallback:"
            find . -name "*.app"
            echo "Error: .app file not found!"
            exit 1
          fi

          echo "Packaging: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r SearchPriceiOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SearchPriceiOS-ipa
          path: SearchPriceiOS.ipa
          retention-days: 7
          
