name: Build SearchPrice iOS IPA and Android APK

on:
  workflow_dispatch:

jobs:
  build-all:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm install

      # --------------------------------------------------
      # 1. 產生原生目錄並編譯 Android APK
      # --------------------------------------------------
      - name: Prebuild Native Folders
        run: npx expo prebuild --clean

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..
          
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found Android APK: $APK_FILE"
          cp "$APK_FILE" SearchPrice.apk

      # --------------------------------------------------
      # 2. 編譯 iOS 原生代碼並封裝 IPA
      # --------------------------------------------------
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Application
        run: |
          cd ios
          
          # 列出所有 Schemes 供排查確認
          xcodebuild -list
          
          # 自動過濾並選取主 Scheme（排除 Pods、Tests、contentsdata）
          SCHEME_NAME=$(xcodebuild -workspace SearchPrice.xcworkspace -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); schemes=data.get('workspace', {}).get('schemes', []); main_schemes=[s for s in schemes if not any(x in s for x in ['Pods', 'Tests', 'contentsdata'])]; print(main_schemes[0] if main_schemes else 'SearchPrice')")
          echo "Target Scheme selected: $SCHEME_NAME"

          # 建立目標輸出目錄
          mkdir -p output_build

          # 執行完整 Release Build，指定輸出路徑與架構
          xcodebuild build \
            -workspace SearchPrice.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            SYMROOT="$(pwd)/output_build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

          cd ..

      - name: Package iOS IPA
        run: |
          echo "Scanning output files:"
          find ios/output_build -name "*.app" || true

          # 尋找由 xcodebuild 產出的 Release-iphoneos 目錄下的 .app
          APP_PATH=$(find ios/output_build/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" ! -path "*/Pods/*" | head -n 1)
          fi

          echo "Selected Target App Path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: Xcode did not produce any .app bundle."
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SearchPrice.ipa Payload

      # --------------------------------------------------
      # 3. 同步上傳雙端成品
      # --------------------------------------------------
      - name: Upload Both Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SearchPrice-Builds
          path: |
            SearchPrice.ipa
            SearchPrice.apk
          retention-days: 7
