name: Build SearchPrice (Android and iOS)

on:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 任務 1：Android APK 編譯（Linux 並行執行）
  # ------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..
          
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" SearchPrice.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SearchPrice-Android-APK
          path: SearchPrice.apk
          retention-days: 7

  # ------------------------------------------------------------------
  # 任務 2：iOS IPA 編譯（macOS 修復 ScanDependencies）
  # ------------------------------------------------------------------
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile & Install CocoaPods
        run: |
          cd ios
          # 自動在 Podfile 加入關閉模組驗證與啟用傳統依賴解析設定
          cat << 'EOF' >> Podfile

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'
                config.build_settings['DEFINES_MODULE'] = 'NO'
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ""
                config.build_settings['CODE_SIGNING_REQUIRED'] = "NO"
                config.build_settings['CODE_SIGNING_ALLOWED'] = "NO"
              end
            end
          end
          EOF

          pod install
          cd ..

      - name: Build iOS Application
        run: |
          cd ios
          
          # 取得 Target 名稱
          TARGET_NAME=$(xcodebuild -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); targets=data.get('project', {}).get('targets', []); print(targets[0] if targets else 'SearchPrice')")
          echo "Building Target: $TARGET_NAME"

          mkdir -p build_output
          export NODE_BINARY=$(which node)

          # 清理 DerivedData
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

          # 關閉 Explicit Module 與 Index Store，避開 ScanDependencies 報錯
          xcodebuild build \
            -workspace SearchPrice.xcworkspace \
            -scheme "$TARGET_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build_output" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_CFLAGS="-fno-modules-validate-once-per-build-session"

          cd ..

      - name: Package iOS IPA
        run: |
          APP_PATH=$(find ios/build_output -type d -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -type d -name "*.app" ! -path "*/Pods/*" | head -n 1)
          fi

          echo "Target App Path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: Xcode did not produce any .app bundle."
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SearchPrice.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SearchPrice-iOS-IPA
          path: SearchPrice.ipa
          retention-days: 7
