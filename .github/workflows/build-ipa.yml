name: Build SearchPrice iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          # 切換至穩定版 Xcode 15.4，避開 Xcode 16 Clang ScanDependencies Bug
          sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS Native Project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Application
        run: |
          cd ios
          
          # 自動取得正確的 Target / Scheme 名稱
          TARGET_NAME=$(xcodebuild -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); targets=data.get('project', {}).get('targets', []); print(targets[0] if targets else 'SearchPrice')")
          echo "Building Target Scheme: $TARGET_NAME"

          mkdir -p build_output
          export NODE_BINARY=$(which node)

          # 清理舊 DerivedData
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

          # 執行免簽名編譯，禁用 Clang 顯式模組掃描
          xcodebuild build \
            -workspace SearchPrice.xcworkspace \
            -scheme "$TARGET_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build_output" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO

          cd ..

      - name: Package iOS IPA
        run: |
          echo "Scanning output directory:"
          ls -la ios/build_output || true

          APP_PATH=$(find ios/build_output -type d -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -type d -name "*.app" ! -path "*/Pods/*" | head -n 1)
          fi

          echo "Target App Path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: Xcode did not produce any .app bundle."
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SearchPrice.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SearchPrice-iOS-IPA
          path: SearchPrice.ipa
          retention-days: 7
