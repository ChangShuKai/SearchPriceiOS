name: Build iOS IPA and Android APK (Free GitHub Runner)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      # 1. 本地生成原生 Android 與 iOS 代碼（不走 Expo 雲端）
      - name: Prebuild Native Folders
        run: npx expo prebuild --clean

      # --------------------------------------------------
      # 2. 編譯 Android Release APK
      # --------------------------------------------------
      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..
          
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" SearchPrice.apk

      # --------------------------------------------------
      # 3. 編譯 iOS 原生未簽名 IPA
      # --------------------------------------------------
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Application
        run: |
          cd ios
          
          # 找出 scheme 名稱，若無則抓 Target 名稱
          SCHEME_NAME=$(xcodebuild -workspace SearchPrice.xcworkspace -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); schemes=data.get('workspace', {}).get('schemes', []); print(schemes[0] if schemes else 'SearchPrice')")
          echo "Compiling Scheme: $SCHEME_NAME"

          # 建立明確的建置輸出目標目錄
          mkdir -p build_output

          # 核心編譯：明確指定 CONFIGURATION_BUILD_DIR，強制 Xcode 將產出的 .app 寫入該目錄
          xcodebuild \
            -workspace SearchPrice.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build_output" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

          cd ..

      - name: Package iOS IPA
        run: |
          # 檢查 build_output 內的 .app
          APP_DIR=$(find ios/build_output -type d -name "*.app" -maxdepth 1 | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
            echo "Searching all .app fallback:"
            find . -type d -name "*.app" ! -path "*/Pods/*"
            echo "Error: Xcode did not output .app to ios/build_output."
            exit 1
          fi

          echo "Found Target App: $APP_DIR"
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r SearchPrice.ipa Payload

      # --------------------------------------------------
      # 4. 一鍵上傳雙端成品
      # --------------------------------------------------
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SearchPrice-Builds
          path: |
            SearchPrice.ipa
            SearchPrice.apk
          retention-days: 7
