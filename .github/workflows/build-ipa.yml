name: Build SearchPrice iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS Native Project
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile & Install CocoaPods
        run: |
          cd ios
          # 停用 Pods 的模組生成，防止 dummy.m 編譯崩潰
          python3 -c "
          with open('Podfile', 'r') as f:
              content = f.read()

          patch = '''
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                end
              end
          '''
          if 'post_install do |installer|' in content:
              content = content.replace('post_install do |installer|', 'post_install do |installer|' + patch)
              with open('Podfile', 'w') as f:
                  f.write(content)
          "
          pod install
          cd ..

      - name: Build iOS Application
        run: |
          cd ios
          mkdir -p build_output
          export NODE_BINARY=$(which node)

          # 直接針對 SearchPrice 專案與 Scheme 構建，透過 ONLY_ACTIVE_ARCH=NO 與明確關閉 User Script Sandboxing
          xcodebuild build \
            -workspace SearchPrice.xcworkspace \
            -scheme SearchPrice \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build_output" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

          cd ..

      - name: Package iOS IPA
        run: |
          APP_PATH=$(find ios/build_output -type d -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -type d -name "*.app" ! -path "*/Pods/*" | head -n 1)
          fi

          echo "Target App Path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: Xcode did not produce any .app bundle."
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SearchPrice.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SearchPrice-iOS-IPA
          path: SearchPrice.ipa
          retention-days: 7
