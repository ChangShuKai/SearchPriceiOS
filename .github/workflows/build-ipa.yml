name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Native Folders
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Unsigned App
        run: |
          cd ios
          SCHEME_NAME=$(xcodebuild -workspace SearchPrice.xcworkspace -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); schemes=data.get('workspace', {}).get('schemes', []); print(schemes[0] if schemes else 'SearchPrice')")
          echo "Building Scheme: $SCHEME_NAME"

          xcodebuild -workspace SearchPrice.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # 全局搜尋編譯產出的 .app 資料夾（排除 Pods 內部產物）
          APP_PATH=$(find . -type d -name "*.app" ! -path "*/Pods/*" | head -n 1)
          
          echo "Found App at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found in entire repository!"
            echo "Current files in build directory:"
            find . -name "*.app" || true
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          zip -r SearchPriceiOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SearchPriceiOS-ipa
          path: SearchPriceiOS.ipa
          retention-days: 7
